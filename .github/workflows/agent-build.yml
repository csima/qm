name: Build agent
run-name: Build ${{ inputs.source }}${{ inputs.subdir && format(' ({0})', inputs.subdir) || '' }} @ ${{ inputs.ref || 'default branch' }}
on:
  workflow_dispatch:
    inputs:
      source:
        description: Agent repository, https://github.com/<owner>/<repo>
        required: true
      ref:
        description: Branch or tag to build (default branch when empty)
        required: false
      subdir:
        description: Directory holding agent.yaml (repository root when empty)
        required: false
      builder_ref:
        description: Ref of this repository whose agent-host builder runs the build
        required: false
        default: claude/cloudflare-env-setup-jie3o9
permissions:
  contents: read
concurrency:
  group: agent-host-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy/layers/sima/agent-host
    steps:
      - name: Check inputs
        working-directory: .
        env:
          SOURCE: ${{ inputs.source }}
          REF: ${{ inputs.ref }}
          SUBDIR: ${{ inputs.subdir }}
        run: |
          [[ "$SOURCE" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "source must be https://github.com/<owner>/<repo>"; exit 1; }
          [[ -z "$REF" || "$REF" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] || { echo "ref has unexpected characters"; exit 1; }
          [[ -z "$SUBDIR" || "$SUBDIR" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] || { echo "subdir has unexpected characters"; exit 1; }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.builder_ref }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: deploy/layers/sima/agent-host/package-lock.json
      - run: npm ci
      - name: Build, push, record and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.AGENT_REPOS_TOKEN }}
          SOURCE: ${{ inputs.source }}
          REF: ${{ inputs.ref }}
          SUBDIR: ${{ inputs.subdir }}
        run: |
          args=(--source "$SOURCE")
          [ -n "$REF" ] && args+=(--ref "$REF")
          [ -n "$SUBDIR" ] && args+=(--subdir "$SUBDIR")
          npm run build-agent -- "${args[@]}"
