name: notes
description: Keeps notebooks of short notes with the notes CLI, for example shopping lists and reminders.
base: mirror.gcr.io/library/debian@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
setup: setup.sh
harness: claude
instance: standard-1
credentials:
  - name: NOTES_TOKEN
    description: Token the notes CLI requires before it reads or writes any notebook
    required: true
egress: []
deny:
  - pattern: '(^|[;&|(]|\bsudo)\s*rm\s[^;&|]*notebooks'
    reason: deletes notebook files directly; use notes remove instead
